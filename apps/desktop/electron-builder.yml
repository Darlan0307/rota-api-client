# Empacotamento para Windows (instalador NSIS).
appId: dev.rota.app
productName: Rota
copyright: Copyright © 2026 Darlan0307
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!out/**/*.map"
asarUnpack:
  # Módulo nativo do Credential Manager precisa estar fora do asar.
  - "**/node_modules/@napi-rs/**"
  - "**/*.node"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: Rota
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Rota
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: Rota
  artifactName: Rota-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
